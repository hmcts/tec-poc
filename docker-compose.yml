services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tec
      POSTGRES_USER: tec
      POSTGRES_PASSWORD: tec
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tec -d tec"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  tec-api-poc:
    build:
      context: .
    image: tec-api-poc:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tec
      DB_USER_NAME: tec
      DB_PASSWORD: tec
      IDAM_API_URL: http://localhost:5000
      LOGBACK_REQUIRE_ALERT_LEVEL: "false"
      LOGBACK_REQUIRE_ERROR_CODE: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
